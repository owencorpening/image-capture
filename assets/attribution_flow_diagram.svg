<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .box { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 2; }
      .free-box { fill: #7ED321; stroke: #5FA319; stroke-width: 2; }
      .text { fill: white; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #FFFF00; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #FFFF00; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
      .free-label { fill: #7ED321; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFFF00" />
    </marker>
  </defs>

  <!-- Browser Bookmarklet -->
  <rect class="box" x="150" y="20" width="300" height="60" rx="5"/>
  <text class="text" x="300" y="55">Browser Bookmarklet</text>

  <!-- Arrow 1 -->
  <line class="arrow" x1="300" y1="80" x2="300" y2="130"/>
  <text class="label" x="350" y="110">Click</text>

  <!-- Captures Data -->
  <rect class="box" x="150" y="130" width="300" height="60" rx="5"/>
  <text class="text" x="300" y="165">Captures Image Data</text>

  <!-- Arrow 2 -->
  <line class="arrow" x1="300" y1="190" x2="300" y2="240"/>
  <text class="label" x="360" y="220">GET Request</text>

  <!-- Google Apps Script (FREE) -->
  <rect class="free-box" x="100" y="240" width="400" height="80" rx="5"/>
  <text class="text" x="300" y="270">Google Apps Script Endpoint</text>
  <text class="free-label" x="300" y="295">FREE • SERVERLESS • ZERO MAINTENANCE</text>

  <!-- Arrow 3 -->
  <line class="arrow" x1="300" y1="320" x2="300" y2="370"/>
  <text class="label" x="380" y="350">Logs Attribution</text>

  <!-- Google Sheet -->
  <rect class="box" x="150" y="370" width="300" height="60" rx="5"/>
  <text class="text" x="300" y="405">Your Google Sheet</text>

  <!-- Bottom note -->
  <text class="label" x="300" y="460" style="font-style: italic; font-size: 13px;">
    This architecture usually costs $$ on AWS/Azure
  </text>
  <text class="label" x="300" y="480" style="font-style: italic; font-size: 13px;">
    With Google Apps Script, it's completely free
  </text>
</svg>